<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Le Jeu Vidéal</title>
    <style>
        /* --- General Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            line-height: 1.6;
        }

        /* --- Navbar --- */
        header {
            background-color: #1f2833;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #66fcf1;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #66fcf1;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            list-style: none;
        }

        .nav-links li {
            margin-left: 20px;
        }

        .nav-links a {
            color: #c5c6c7;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #66fcf1;
        }

        /* --- Main Content Layout --- */
        main {
            padding: 60px 20px;
            max-width: 1000px;
            margin: 0 auto;
            min-height: 75vh;
        }

        .page-title {
            text-align: center;
            font-size: 2.8rem;
            color: #fff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            font-size: 1.2rem;
            color: #c5c6c7;
            margin-bottom: 40px;
        }

        /* --- Button Container & Styling --- */
        .selector-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .tab-btn {
            background: #1f2833;
            color: #fff;
            border: 2px solid #2f3b4c;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            border-color: #66fcf1;
            color: #66fcf1;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: #66fcf1;
            color: #0b0c10;
            border-color: #66fcf1;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.3);
        }

        /* --- Privacy Content Container --- */
        .privacy-box {
            background-color: #1f2833;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        /* Style des éléments HTML injectés */
        .privacy-box h1 {
            font-size: 2.2rem;
            color: #fff;
            margin-bottom: 20px;
            border-bottom: 2px solid #66fcf1;
            padding-bottom: 10px;
        }

        .privacy-box h2 {
            font-size: 1.6rem;
            color: #fff;
            margin-top: 30px;
            margin-bottom: 15px;
            border-left: 4px solid #45f3ff;
            padding-left: 10px;
        }

        .privacy-box h3 {
            font-size: 1.2rem;
            color: #66fcf1;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .privacy-box p {
            font-size: 1.05rem;
            margin-bottom: 15px;
            color: #c5c6c7;
        }

        .privacy-box ul {
            margin-left: 25px;
            margin-bottom: 20px;
        }

        .privacy-box li {
            margin-bottom: 8px;
            font-size: 1.05rem;
        }

        .privacy-box strong {
            color: #fff;
        }

        .privacy-box a {
            color: #45f3ff;
            text-decoration: none;
        }

        .privacy-box a:hover {
            text-decoration: underline;
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Footer --- */
        footer {
            background-color: #1f2833;
            text-align: center;
            padding: 20px;
            color: #c5c6c7;
            font-size: 0.9rem;
            border-top: 1px solid #2f3b4c;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
            }
            .nav-links li {
                margin: 0 10px;
            }
            .selector-container {
                flex-direction: column;
                gap: 12px;
            }
            .tab-btn {
                width: 100%;
            }
            .privacy-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">Le Jeu Vidéal</a>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#ball">ball.</a></li>
                <li><a href="index.html#adventure-runner">Adventure Runner</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1 class="page-title">Privacy Policies</h1>
        <p class="subtitle">Please select a game to view its full Privacy Policy.</p>

        <div class="selector-container">
            <button class="tab-btn" onclick="showPrivacy(this, 'ball')">ball.</button>
            <button class="tab-btn" onclick="showPrivacy(this, 'adventure')">Adventure Runner</button>
        </div>

        <div id="privacy-display" class="privacy-box"></div>
    </main>

    <footer>
        <p>&copy; 2026 Le Jeu Vidéal. All rights reserved.</p>
    </footer>

    <script>
        function showPrivacy(buttonElement, gameKey) {
            let targetFile = '';
            if (gameKey === 'ball') {
                targetFile = 'privacy-ball.html';
            } else if (gameKey === 'adventure') {
                targetFile = 'privacy-adventure-runner.html';
            }

            fetch(targetFile)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.text();
                })
                .then(htmlContent => {
                    const displayBox = document.getElementById('privacy-display');
                    
                    // Injecter le code HTML
                    displayBox.innerHTML = htmlContent;
                    displayBox.style.display = 'block';
                    
                    // Retirer la classe 'active' de tous les boutons
                    const buttons = document.querySelectorAll('.tab-btn');
                    buttons.forEach(btn => btn.classList.remove('active'));
                    
                    // Ajouter la classe 'active' au bouton qui a déclenché l'événement
                    buttonElement.classList.add('active');
                })
                .catch(error => {
                    console.error('Erreur lors du chargement de la Privacy Policy:', error);
                    document.getElementById('privacy-display').innerHTML = '<p style="color: #ff4a4a;">Error loading the privacy policy. Please ensure the file exists in the same directory.</p>';
                    document.getElementById('privacy-display').style.display = 'block';
                });
        }
    </script>

</body>
</html>
